# Observability stack for the control-plane node.
# All secrets come from an .env file that is NOT part of this repository.
# Addresses and slugs are placeholders.

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight-data:/data

  # ================= GlitchTip (Sentry-compatible error tracking) =================
  glitchtip-postgres:
    image: postgres:15
    container_name: glitchtip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GLITCHTIP_DB_NAME}
      POSTGRES_USER: ${GLITCHTIP_DB_USER}
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD}
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    container_name: glitchtip-redis
    restart: unless-stopped
    volumes:
      - glitchtip-redis-data:/data

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-web
    restart: unless-stopped
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    ports:
      - "10.10.0.21:8002:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/${GLITCHTIP_DB_NAME}
      REDIS_URL: redis://glitchtip-redis:6379/0

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/${GLITCHTIP_DB_NAME}
      REDIS_URL: redis://glitchtip-redis:6379/0

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip-migrate
    restart: "no"
    command: ./bin/run-migrate.sh
    depends_on:
      - glitchtip-postgres
      - glitchtip-redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${GLITCHTIP_DB_USER}:${GLITCHTIP_DB_PASSWORD}@glitchtip-postgres:5432/${GLITCHTIP_DB_NAME}
      REDIS_URL: redis://glitchtip-redis:6379/0

  # ================= Loki (internal only — no host port exposed) =================
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  # nginx basic-auth proxy — the only externally reachable path into Loki
  loki-proxy:
    image: nginx:alpine
    container_name: loki-proxy
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "10.10.0.21:3100:80"
    volumes:
      - ./loki-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./loki-proxy/.htpasswd:/etc/nginx/.htpasswd:ro

  # ================= Grafana =================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "10.10.0.21:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
    volumes:
      - grafana-data:/var/lib/grafana

  # ================= Ntfy =================
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
    ports:
      - "10.10.0.21:8080:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-data:/var/lib/ntfy

volumes:
  redis-data:
  redisinsight-data:
  glitchtip-postgres-data:
  glitchtip-redis-data:
  loki-data:
  grafana-data:
  ntfy-cache:
  ntfy-data:
