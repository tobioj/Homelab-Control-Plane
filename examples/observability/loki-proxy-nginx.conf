# Basic-auth gateway in front of Loki. The .htpasswd file is NOT included.

events {}
http {
  server {
    listen 80;

    location /loki/api/v1/push {
      allow 10.10.0.0/24;
      deny all;
      auth_basic "Loki Push";
      auth_basic_user_file /etc/nginx/.htpasswd;
      proxy_pass http://loki:3100/loki/api/v1/push;
      proxy_set_header Host $host;
    }

    location / {
      return 404;
    }
  }
}
