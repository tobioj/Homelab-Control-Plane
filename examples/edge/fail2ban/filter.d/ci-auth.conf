# Failed credentials on the CI server: a 401 for a request that carried a username, or a wrong token sent to
# the APIs. The GitHub webhook answers bad signatures with 403 precisely so this filter can never ban GitHub.
[Definition]
failregex = ^<HOST> - (?!-\s)\S+ \[[^\]]*\] "[A-Z]+ [^"]*" 401\s
            ^<HOST> - \S+ \[[^\]]*\] "[A-Z]+ /(?:pushlane-api|api/v1)/[^"]*" 401\s
ignoreregex =
