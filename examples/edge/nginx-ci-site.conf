# Example: the edge proxy's site for the CI server (sanitised; rates illustrative).
# Rate limits are keyed by client IP; the runner VM is exempt so job checkouts are never throttled.
geo $ci_limit_key {
    default          $binary_remote_addr;
    10.10.0.40/32    "";                     # ci-runner: empty key = not limited
}
limit_req_zone $ci_limit_key zone=ci_auth:10m rate=12r/m;   # sign-in, 2FA, token creation
limit_req_zone $ci_limit_key zone=ci_all:10m  rate=40r/s;   # everything else
limit_req_zone $ci_limit_key zone=ci_api:10m  rate=6r/s;    # the Pushlane API
limit_req_status 429;

server {
    listen 443 ssl;
    server_name example-ci.duckdns.org;
    server_tokens off;
    access_log /var/log/nginx/ci.access.log;      # read by fail2ban and the daily digest

    ssl_certificate     /etc/letsencrypt/live/example-ci.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example-ci.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # git pushes can be large: stream them to Forgejo instead of buffering on the edge
    client_max_body_size 512m;
    proxy_request_buffering off;

    location ~ ^/(user/login|user/two_factor|user/forgot_password|api/v1/users/[^/]+/tokens) {
        limit_req zone=ci_auth burst=10 nodelay;
        proxy_pass http://10.10.0.30:3000;
    }

    # GitHub App webhooks and setup pages; every webhook is checked against the App's secret
    location ^~ /pushlane-api/v1/github/ {
        limit_req zone=ci_all burst=100 nodelay;
        client_max_body_size 25m;
        proxy_pass http://10.10.0.30:3002;
    }

    # job logs, re-run and cancel; every request is checked by Forgejo with the caller's token
    location ^~ /pushlane-api/ {
        limit_req zone=ci_api burst=20 nodelay;
        proxy_pass http://10.10.0.30:3001;
    }

    location / {
        limit_req zone=ci_all burst=200 nodelay;
        proxy_pass http://10.10.0.30:3000;
    }
}
