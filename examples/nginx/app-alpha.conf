# Generated per-application vhost.
#
# Notes:
#  * proxy_pass targets a unix socket, not a TCP port, so the application is
#    reachable ONLY through nginx -- access control is filesystem permissions.
#
#  * The /static/ alias is framework-gated by the generator. It points at Django's
#    collected-static output directory; for a framework that never creates that
#    directory, this alias would shadow a /static route the app serves itself.
#
#  * There is no :80 server block. Inbound port 80 is blocked upstream by the ISP,
#    which is also why certificates are issued over DNS-01 rather than HTTP-01.

server {
    listen 443 ssl;
    server_name app-alpha.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/app-alpha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app-alpha.duckdns.org/privkey.pem;

    location /static/ {
        alias /srv/apps/app-alpha/staticfiles/;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn/app-alpha.sock;
    }
}
