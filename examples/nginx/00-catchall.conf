# Default-server catch-all. MANDATORY, and named to sort first.
#
# Without a default_server, a request whose Host header matches no configured
# vhost falls through to whichever server block nginx considers first -- so one
# application ends up answering for a domain that isn't its own.
#
# 444 is nginx's non-standard "close the connection without a response", which is
# the correct answer to a host we don't serve: no banner, no information.
#
# A certificate is still required to reach the SNI stage at all; any valid cert on
# the box will do, since nothing is ever served from this block. This file is on
# the control panel's protected-filenames list and can never be overwritten by a
# generated per-app config.

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/primary-store.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primary-store.duckdns.org/privkey.pem;

    return 444;
}
