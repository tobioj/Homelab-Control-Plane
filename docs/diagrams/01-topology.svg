<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .frame { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.5; }
    .ext   { fill:#ede9fe; stroke:#7c5cd6; stroke-width:1.5; }
    .vm    { fill:#ffffff; stroke:#475569; stroke-width:2; }
    .svc   { fill:#dbeafe; stroke:#2f6fb5; stroke-width:1.2; }
    .svcg  { fill:#dcfce7; stroke:#2f8f5b; stroke-width:1.2; }
    .svca  { fill:#fef3c7; stroke:#b4840e; stroke-width:1.2; }
    .svcr  { fill:#fee2e2; stroke:#c2483f; stroke-width:1.2; }
    .net   { fill:#e2e8f0; stroke:#475569; stroke-width:1.5; }
    .tb    { fill:#0f172a; font-size:14px; font-weight:700; }
    .th    { fill:#0f172a; font-size:17px; font-weight:700; }
    .ts    { fill:#475569; font-size:11.5px; }
    .tm    { fill:#334155; font-size:11.5px; font-style:italic; }
    .ln    { stroke:#475569; stroke-width:2; fill:none; }
    .lnr   { stroke:#c2483f; stroke-width:3; fill:none; }
    .lnp   { stroke:#7c5cd6; stroke-width:2; fill:none; stroke-dasharray:6 4; }
    .lnd   { stroke:#475569; stroke-width:2; fill:none; stroke-dasharray:5 3; }
  </style>
  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L0,10 L11,5 z" fill="#475569"/>
    </marker>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="5.5" orient="auto">
      <path d="M0,0 L0,11 L12,5.5 z" fill="#c2483f"/>
    </marker>
    <marker id="ap" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L0,10 L11,5 z" fill="#7c5cd6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="800" fill="#ffffff"/>

  <text class="th" x="20" y="28">Homelab topology — control plane vs. data plane</text>
  <text class="ts" x="20" y="48">Two VMs on one hypervisor. The infra node orchestrates deployments; the app node serves public traffic. All addresses illustrative.</text>

  <!-- ============ EXTERNAL SERVICES (ordered so edges stay short) ============ -->
  <rect class="ext" x="20"  y="66" width="200" height="54" rx="8"/>
  <text class="tb" x="120" y="88"  text-anchor="middle">Managed Postgres</text>
  <text class="ts" x="120" y="106" text-anchor="middle">serverless · one DB per app</text>

  <rect class="ext" x="232" y="66" width="200" height="54" rx="8"/>
  <text class="tb" x="332" y="88"  text-anchor="middle">Vendor APIs</text>
  <text class="ts" x="332" y="106" text-anchor="middle">payments · shipping · mail</text>

  <rect class="ext" x="444" y="66" width="170" height="54" rx="8"/>
  <text class="tb" x="529" y="88"  text-anchor="middle">GitHub</text>
  <text class="ts" x="529" y="106" text-anchor="middle">source + Actions</text>

  <rect class="ext" x="626" y="66" width="190" height="54" rx="8"/>
  <text class="tb" x="721" y="88"  text-anchor="middle">Let's Encrypt</text>
  <text class="ts" x="721" y="106" text-anchor="middle">DNS-01 certificates</text>

  <rect class="ext" x="828" y="66" width="212" height="54" rx="8"/>
  <text class="tb" x="934" y="88"  text-anchor="middle">DuckDNS</text>
  <text class="ts" x="934" y="106" text-anchor="middle">dynamic DNS + ACME TXT</text>

  <!-- ============ PUBLIC VISITOR ============ -->
  <rect class="net" x="395" y="150" width="270" height="44" rx="8"/>
  <text class="tb" x="530" y="172" text-anchor="middle">Public visitor</text>
  <text class="ts" x="530" y="187" text-anchor="middle">https://&lt;app&gt;.duckdns.org</text>

  <line x1="20" y1="206" x2="1040" y2="206" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="tm" x="1040" y="201" text-anchor="end">home network boundary</text>

  <!-- ============ ROUTER ============ -->
  <rect class="net" x="400" y="218" width="260" height="52" rx="8"/>
  <text class="tb" x="530" y="239" text-anchor="middle">Home router — NAT</text>
  <text class="ts" x="530" y="257" text-anchor="middle">one dynamic WAN IP · :443 forwarded</text>

  <!-- ============ HYPERVISOR FRAME ============ -->
  <rect class="frame" x="20" y="282" width="1020" height="480" rx="12"/>
  <text class="th" x="38" y="308">Hypervisor (type-1, bare metal) · private LAN 10.10.0.0/24</text>
  <text class="ts" x="38" y="326">Nothing here is internet-reachable except via the router's single :443 forward.</text>

  <!-- ===== APP NODE ===== -->
  <rect class="vm" x="40" y="356" width="470" height="390" rx="10"/>
  <path class="svcr" d="M40 366 a10 10 0 0 1 10 -10 h450 a10 10 0 0 1 10 10 v20 h-470 z"/>
  <text class="tb" x="58" y="377">app-node · 10.10.0.20 · DATA PLANE</text>

  <rect class="svc" x="58" y="400" width="434" height="46" rx="6"/>
  <text class="tb" x="74" y="420">nginx</text>
  <text class="ts" x="74" y="437">TLS termination · one vhost per app · catch-all returns 444</text>

  <text class="ts" x="58" y="466">per application — one set of units per deployed app:</text>

  <rect class="svcg" x="58"  y="474" width="138" height="60" rx="6"/>
  <text class="tb" x="127" y="495" text-anchor="middle">gunicorn</text>
  <text class="ts" x="127" y="512" text-anchor="middle">2 workers, gthread</text>
  <text class="ts" x="127" y="526" text-anchor="middle">unix socket</text>

  <rect class="svcg" x="206" y="474" width="138" height="60" rx="6"/>
  <text class="tb" x="275" y="495" text-anchor="middle">celery worker</text>
  <text class="ts" x="275" y="512" text-anchor="middle">async tasks</text>
  <text class="ts" x="275" y="526" text-anchor="middle">Redis broker</text>

  <rect class="svcg" x="354" y="474" width="138" height="60" rx="6"/>
  <text class="tb" x="423" y="495" text-anchor="middle">celery beat</text>
  <text class="ts" x="423" y="512" text-anchor="middle">periodic tasks</text>
  <text class="ts" x="423" y="526" text-anchor="middle">DB-backed schedule</text>

  <rect class="net" x="58" y="556" width="434" height="76" rx="6"/>
  <text class="tb" x="74" y="576">systemd — templated (%i) + generated concrete units</text>
  <text class="ts" x="74" y="594">gunicorn@&lt;app&gt; · celery@&lt;app&gt; · celerybeat@&lt;app&gt;</text>
  <text class="ts" x="74" y="610">EnvironmentFile=/srv/apps/&lt;app&gt;/.env · Restart=on-failure</text>
  <text class="ts" x="74" y="625">RuntimeDirectoryPreserve=yes — socket survives a restart</text>

  <rect class="net" x="58" y="644" width="434" height="74" rx="6"/>
  <text class="tb" x="74" y="664">filesystem layout</text>
  <text class="ts" x="74" y="682">/srv/apps/&lt;app&gt;/ — repo · venv · staticfiles · .env (0600)</text>
  <text class="ts" x="74" y="698">/etc/letsencrypt/ — root-only 0700, opaque to the deploy user</text>
  <text class="ts" x="74" y="712">~/.cp-staging/ — write-then-privileged-copy staging area</text>

  <!-- ===== INFRA NODE ===== -->
  <rect class="vm" x="550" y="356" width="470" height="390" rx="10"/>
  <path class="svc" d="M550 366 a10 10 0 0 1 10 -10 h450 a10 10 0 0 1 10 10 v20 h-470 z"/>
  <text class="tb" x="568" y="377">infra-node · 10.10.0.21 · CONTROL PLANE</text>

  <rect class="svca" x="568" y="400" width="434" height="62" rx="6"/>
  <text class="tb" x="584" y="420">Control Panel — FastAPI + Jinja2 (~5.6k LOC)</text>
  <text class="ts" x="584" y="437">onboarding wizard · lifecycle · push-to-deploy · log viewer</text>
  <text class="ts" x="584" y="453">SQLite state · Fernet-encrypted secrets · append-only audit log</text>

  <rect class="svcg" x="568" y="474" width="210" height="60" rx="6"/>
  <text class="tb" x="673" y="495" text-anchor="middle">Redis (shared)</text>
  <text class="ts" x="673" y="512" text-anchor="middle">16 DBs, ledger-allocated</text>
  <text class="ts" x="673" y="526" text-anchor="middle">broker + cache per app</text>

  <rect class="svcg" x="792" y="474" width="210" height="60" rx="6"/>
  <text class="tb" x="897" y="495" text-anchor="middle">systemd timers</text>
  <text class="ts" x="897" y="512" text-anchor="middle">DDNS 5m · uptime 3m</text>
  <text class="ts" x="897" y="526" text-anchor="middle">cert renewal daily</text>

  <text class="ts" x="568" y="562">observability stack (Docker Compose):</text>

  <rect class="svc" x="568" y="570" width="104" height="52" rx="6"/>
  <text class="tb" x="620" y="592" text-anchor="middle">Grafana</text>
  <text class="ts" x="620" y="608" text-anchor="middle">dashboards</text>

  <rect class="svc" x="678" y="570" width="104" height="52" rx="6"/>
  <text class="tb" x="730" y="592" text-anchor="middle">Loki</text>
  <text class="ts" x="730" y="608" text-anchor="middle">log aggregation</text>

  <rect class="svc" x="788" y="570" width="104" height="52" rx="6"/>
  <text class="tb" x="840" y="592" text-anchor="middle">GlitchTip</text>
  <text class="ts" x="840" y="608" text-anchor="middle">error tracking</text>

  <rect class="svc" x="898" y="570" width="104" height="52" rx="6"/>
  <text class="tb" x="950" y="592" text-anchor="middle">ntfy</text>
  <text class="ts" x="950" y="608" text-anchor="middle">push alerts</text>

  <rect class="net" x="568" y="636" width="434" height="82" rx="6"/>
  <text class="tb" x="584" y="656">why the control plane is a separate machine</text>
  <text class="ts" x="584" y="674">A botched deploy cannot take down the tool doing the deploying.</text>
  <text class="ts" x="584" y="690">Secrets stay here encrypted at rest; the app node only ever receives</text>
  <text class="ts" x="584" y="706">the single .env it needs, over SFTP — never inside a shell command.</text>

  <text class="tm" x="38" y="754">app-node also makes outbound calls to Let's Encrypt (ACME), vendor APIs and object storage.</text>

  <!-- ============ EDGES ============ -->
  <line class="ln" x1="530" y1="194" x2="530" y2="218" marker-end="url(#a)"/>
  <path class="ln" d="M 480 270 L 480 340 L 275 340 L 275 356" marker-end="url(#a)"/>
  <text class="ts" x="290" y="334">HTTPS :443</text>

  <path class="lnr" d="M 550 371 L 518 371" marker-end="url(#ar)"/>

  <path class="lnd" d="M 275 534 L 275 542 L 673 542 L 673 536" marker-end="url(#a)"/>

  <path class="lnp" d="M 40 420 L 30 420 L 30 132 L 120 132 L 120 122" marker-end="url(#ap)"/>
  <text class="ts" x="134" y="130">DATABASE_URL over TLS</text>

  <path class="lnp" d="M 1020 420 L 1032 420 L 1032 132 L 934 132 L 934 122" marker-end="url(#ap)"/>
  <text class="ts" x="926" y="130" text-anchor="end">A-record refresh</text>

  <!-- ============ LEGEND ============ -->
  <line class="lnr" x1="40" y1="780" x2="70" y2="780"/>
  <text class="ts" x="78" y="784">SSH orchestration (single scoped key)</text>
  <line class="lnd" x1="330" y1="780" x2="360" y2="780"/>
  <text class="ts" x="368" y="784">Redis broker / cache traffic</text>
  <line class="lnp" x1="580" y1="780" x2="610" y2="780"/>
  <text class="ts" x="618" y="784">outbound to external services</text>
  <line class="ln" x1="820" y1="780" x2="850" y2="780"/>
  <text class="ts" x="858" y="784">public request path</text>
</svg>
